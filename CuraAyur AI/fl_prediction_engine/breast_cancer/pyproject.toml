[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breast-fl-engine"
version = "1.0.0"
description = "Federated Breast Cancer Prediction Model"
authors = [{ name = "CuraAyur AI Team" }]
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.32.1"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
min-available-clients = 2
models-dir = "models"
